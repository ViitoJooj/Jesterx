name: verkoupe-dev

services:
  view:
    build:
      context: ../../www
    env_file:
      - ../../.env
    ports:
      - "5173:5173"
    depends_on:
      - daemon

  daemon:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-database}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-database}"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
  redis:
    image: redis:7-alpine
    profiles: ["storage-extra"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  mongo:
    image: mongo:7
    profiles: ["storage-extra"]
    env_file:
      - ../../.env
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - view
      - daemon
volumes:
  postgres-data:
  redis-data:
  mongo-data: