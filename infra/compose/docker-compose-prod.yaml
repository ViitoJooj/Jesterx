name: jesterx-prod

services:
  view:
    image: jesterxview:latest
    env_file:
      - ../../.env
    deploy:
      replicas: 2
    depends_on:
      - daemon

  daemon:
    image: jesterxdaemon:latest
    env_file:
      - ../../.env
    deploy:
      replicas: 3
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-database}
    deploy:
      replicas: 3
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    profiles: ["storage-extra"]
    volumes:
      - redis-data:/data
  mongo:
    image: mongo:7
    profiles: ["storage-extra"]
    env_file:
      - ../../.env
    volumes:
      - mongo-data:/data/db
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - view
      - daemon

volumes:
  postgres-data:
  caddy-data:
  redis-data:
  mongo-data: